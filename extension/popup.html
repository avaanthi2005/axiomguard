<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #0a0e1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e3a5f;
    }
    .logo {
      font-size: 13px;
      font-weight: 800;
      color: #00d4ff;
      letter-spacing: 2px;
    }
    .verdict-box {
      background: #111827;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid #1e3a5f;
    }
    .verdict-text {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 4px;
    }
    .score-text {
      font-size: 12px;
      color: #94a3b8;
    }
    .domain-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      word-break: break-all;
    }
    .action-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      background: #00d4ff;
      color: #0a0e1a;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
    }
    .green  { color: #10b981; }
    .yellow { color: #f59e0b; }
    .orange { color: #f97316; }
    .red    { color: #ef4444; }
    .no-result {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>⚔</span>
    <span class="logo">AXIOM//GUARD</span>
  </div>
  <div id="content">
    <div class="no-result">
      <div style="font-size:24px;margin-bottom:8px;">🛡️</div>
      Analyzing current page...<br>
      <span style="font-size:10px;">Make sure the AXIOMGUARD backend is running on localhost:8000</span>
    </div>
  </div>
  <button class="btn" id="open-axiomguard-btn">
    OPEN AXIOMGUARD
  </button>
  <script src="popup.js"></script>
</body>
</html>
